specVersion: "3.0"
metadata:
  name: com.nexussupply.procurementportal
type: application
resources:
  configuration:
    paths:
      webapp: webapp
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: nexus-supply-procurement
        includeDependencies: false